<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#0b1220"/><title>KITC Digital Management System</title><link rel="stylesheet" href="src/styles.css"/><style>[hidden]{display:none!important}.kitc-gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b1220;color:#fff}.kitc-gate-card{width:min(440px,100%);padding:32px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(255,255,255,.06)}.kitc-gate-mark{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:#fff;color:#0b1220;font-size:24px;font-weight:800;margin-bottom:22px}.kitc-gate-card h1{margin:0 0 8px}.kitc-gate-card p{color:#aeb8c9;line-height:1.55}.kitc-gate-card label{display:block;margin:20px 0 8px;font-size:13px;font-weight:700}.kitc-gate-card input{box-sizing:border-box;width:100%;padding:14px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:#111b2d;color:#fff}.kitc-gate-actions{display:grid;gap:10px;margin-top:16px}.kitc-gate-actions button{width:100%;padding:13px 16px;border:0;border-radius:12px;font-weight:700;cursor:pointer}.kitc-usb{background:#fff;color:#0b1220}.kitc-unlock{background:#26344d;color:#fff}.kitc-gate-status{min-height:22px;margin-top:16px;font-size:13px;color:#ffb4b4}.kitc-gate-status[data-good="true"]{color:#9ff0c3}.kitc-gate-hint{font-size:12px!important;color:#7f8da5!important;margin-top:18px!important}.record-menu{background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:5px;min-width:145px}.record-menu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px 11px;border-radius:7px;cursor:pointer}.record-menu button:hover{background:#f1f3f5}.universal-results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:9998;overflow:hidden}.universal-result{display:block;width:100%;border:0;background:#fff;text-align:left;padding:11px 14px;cursor:pointer}.universal-result:hover{background:#f4f6f8}.universal-result strong,.universal-result small{display:block}.universal-result small{margin-top:3px;color:#687385}.universal-empty{padding:14px;color:#687385}.search-highlight{outline:2px solid currentColor;outline-offset:-2px}.documents-toolbar{display:flex;justify-content:space-between;gap:12px;margin:-10px 0 16px;color:#7b879a;font-size:11px}.documents-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.document-card{background:#fff;border:1px solid #e6eaf0;border-radius:14px;overflow:hidden}.document-preview{width:100%;height:190px;border:0;background:#f2f5f8;padding:0;cursor:pointer;display:grid;place-items:center;overflow:hidden}.document-preview img{width:100%;height:100%;object-fit:cover}.file-placeholder{font-size:42px;color:#8792a4}.document-info{padding:14px 16px}.document-name-row{display:flex;align-items:center;gap:8px}.document-name{flex:1;border:0;background:transparent;text-align:left;padding:0;font-size:13px;font-weight:800;color:#172033;cursor:pointer}.document-menu-button{border:0;background:transparent;font-size:20px;color:#69758a;cursor:pointer}.document-category{margin-top:6px;font-size:10px;color:#8994a7}.document-info p{font-size:11px;line-height:1.55;color:#69758a;margin:9px 0 0;min-height:34px}.document-empty{text-align:center;background:#fff;border:1px dashed #d7dee8;border-radius:14px;padding:45px 20px;color:#69758a}.document-empty h3{color:#172033;margin:12px 0 6px}.document-empty p{font-size:11px;margin:0 auto 18px;max-width:420px}.document-lightbox{position:fixed;inset:0;background:rgba(4,9,18,.82);display:grid;place-items:center;padding:24px;z-index:200}.document-lightbox-inner{position:relative;max-width:min(1000px,96vw);max-height:92vh;background:#fff;border-radius:14px;padding:16px;display:grid;gap:10px;overflow:auto}.document-lightbox-inner>button{position:absolute;right:12px;top:8px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:32px;height:32px;font-size:22px;cursor:pointer}.document-lightbox-inner img{max-width:90vw;max-height:72vh;object-fit:contain;border-radius:8px}.document-lightbox-inner strong{font-size:14px}.document-lightbox-inner p{margin:0;color:#69758a;font-size:11px;line-height:1.5}.document-modal textarea,.document-modal select{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #dfe5ed;border-radius:8px;outline:none;font:inherit;font-size:11px;background:#fff}.document-modal textarea:focus,.document-modal select:focus{border-color:#8d9ab0}@media(max-width:950px){.documents-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.documents-grid{grid-template-columns:1fr}.documents-toolbar{font-size:10px}.document-preview{height:210px}}</style></head><body><section class="kitc-gate" id="kitcGate" hidden><div class="kitc-gate-card"><div class="kitc-gate-mark">K</div><div class="eyebrow">KITC • SECRETARY ACCESS</div><h1>Unlock KITC</h1><p>Connect the KITC Secretary USB and enter the Secretary password to open the management system.</p><label for="kitcPassword">Secretary password</label><input id="kitcPassword" type="password" autocomplete="current-password" placeholder="Enter password"/><div class="kitc-gate-actions"><button class="kitc-usb" id="connectKitcUsb">🔌 Connect KITC USB</button><button class="kitc-unlock" id="unlockKitc">🔐 Unlock KITC</button></div><div class="kitc-gate-status" id="kitcGateStatus" aria-live="polite"></div><p class="kitc-gate-hint" id="kitcSetupHint"></p></div></section><div class="app-shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">K</div><div><strong>KITC</strong><span>Digital Management</span></div></div><nav class="nav" aria-label="Primary navigation"><button class="nav-item active" data-section="dashboard">⌂ <span>Dashboard</sp
