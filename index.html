<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>KITC Digital Management System</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <section class="kitc-gate" id="kitcGate" hidden>
    <div class="kitc-gate-card">
      <img class="gate-logo" src="Screenshot_20260821-202536.png" alt="KITC logo" />
      <div class="eyebrow">KITC • SECRETARY ACCESS</div>
      <h1>Unlock KITC</h1>
      <p>Connect the KITC Secretary USB and enter the Secretary password to open the management system.</p>
      <label for="kitcPassword">Secretary password</label>
      <input id="kitcPassword" type="password" autocomplete="current-password" placeholder="Enter password" />
      <div class="kitc-gate-actions">
        <button class="kitc-usb" id="connectKitcUsb">🔌 Connect KITC USB</button>
        <button class="kitc-unlock" id="unlockKitc">🔐 Unlock KITC</button>
      </div>
      <div class="kitc-gate-status" id="kitcGateStatus" aria-live="polite"></div>
      <p class="kitc-gate-hint" id="kitcSetupHint"></p>
    </div>
  </section>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo-wrap"><img src="Screenshot_20260821-202536.png" alt="KITC" /></div>
        <div><strong>KITC</strong><span>Secretary Management</span></div>
      </div>
      <nav class="nav" aria-label="Primary navigation">
        <button class="nav-item active" data-section="dashboard"><span class="nav-icon">⌂</span><span>Dashboard</span></button>
        <button class="nav-item" data-section="members"><span class="nav-icon">♙</span><span>Members</span></button>
        <button class="nav-item" data-section="meetings"><span class="nav-icon">▣</span><span>Meetings</span></button>
        <button class="nav-item" data-section="tasks"><span class="nav-icon">✓</span><span>Tasks</span></button>
        <button class="nav-item" data-section="events"><span class="nav-icon">★</span><span>Programs & Events</span></button>
        <button class="nav-item" data-section="attendance"><span class="nav-icon">◷</span><span>Attendance</span></button>
        <button class="nav-item" data-section="assets"><span class="nav-icon">▤</span><span>IT / Assets</span></button>
        <button class="nav-item" data-section="documents"><span class="nav-icon">▱</span><span>Documents</span></button>
        <button class="nav-item" data-section="reports"><span class="nav-icon">▥</span><span>Reports</span></button>
        <button class="nav-item" data-section="handover"><span class="nav-icon">↗</span><span>Handover Center</span></button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-section="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
        <div class="term-card"><span>Current term</span><strong>2026–27</strong><small>Secretary • Anim</small></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu" id="menuButton" aria-label="Open menu">☰</button>
          <div class="topbar-title"><span>KITC</span><strong>Secretary Management System</strong></div>
        </div>
        <div class="topbar-right">
          <div class="search"><span>⌕</span><input id="globalSearch" placeholder="Search members, meetings, tasks..." /></div>
          <button class="icon-button" type="button" aria-label="Notifications">◔</button>
          <button class="profile" type="button"><span class="profile-avatar">A</span><span>Anim<br><small>Secretary</small></span></button>
        </div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="src/kitc-bootstrap.js?v=frontend1"></script>
  <script src="src/main.js?v=frontend1"></script>
  <script src="src/usb-gate.js?v=frontend1"></script>
  <script src="src/module-fix.js?v=frontend1"></script>
  <script src="src/documents.js?v=frontend1"></script>
  <script src="src/members.js?v=frontend1"></script>
</body>
</html>
