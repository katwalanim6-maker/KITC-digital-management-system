<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080a19" />
  <meta name="color-scheme" content="dark" />
  <meta name="kitc-build" content="20260822-functional-v2" />
  <title>KITC Secretary Desk</title>

  <style>
    html, body { margin: 0; min-height: 100%; background: #080a19 !important; color: #fff !important; }
    body { overflow-x: hidden; }
    #kitcApp { min-height: 100vh; background: #080a19 !important; color: #fff !important; }
  </style>

  <link rel="stylesheet" href="src/styles.css?v=20260822-12" />
  <link rel="stylesheet" href="src/usb-gate.css?v=20260822-12" />
  <link rel="stylesheet" href="src/kitc-theme.css?v=20260822-12" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <section class="kitc-gate" id="kitcGate">
    <div class="kitc-gate-card">
      <div class="kitc-gate-mark">K</div>
      <div class="eyebrow">KITC • SECRETARY ACCESS</div>
      <h1>Unlock KITC</h1>
      <p>Connect the KITC Secretary USB and enter the Secretary password to open the management system.</p>
      <label for="kitcPassword">Secretary password</label>
      <input id="kitcPassword" type="password" autocomplete="current-password" placeholder="Enter password" />
      <div class="kitc-gate-actions">
        <button class="kitc-usb" id="connectKitcUsb" type="button">🔌 Connect KITC USB</button>
        <button class="kitc-unlock" id="unlockKitc" type="button">🔐 Unlock KITC</button>
      </div>
      <div class="kitc-gate-status" id="kitcGateStatus" aria-live="polite"></div>
      <p class="kitc-gate-hint" id="kitcSetupHint"></p>
    </div>
  </section>

  <div class="app-shell" id="kitcApp" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">K</div>
        <div><strong>KITC</strong><span>Secretary Desk</span></div>
      </div>

      <nav class="nav" aria-label="Primary navigation">
        <button class="nav-item active" data-section="dashboard" type="button">⌂ <span>Overview</span></button>
        <button class="nav-item" data-section="members" type="button">♙ <span>Members</span></button>
        <button class="nav-item" data-section="meetings" type="button">▣ <span>Meetings</span></button>
        <button class="nav-item" data-section="tasks" type="button">✓ <span>My Tasks</span></button>
        <button class="nav-item" data-section="events" type="button">★ <span>Events</span></button>
        <button class="nav-item" data-section="attendance" type="button">◷ <span>Attendance</span></button>
        <button class="nav-item" data-section="documents" type="button">▱ <span>Documents</span></button>
        <button class="nav-item" data-section="reports" type="button">▥ <span>Reports</span></button>
        <button class="nav-item" data-section="handover" type="button">↗ <span>Handover</span></button>
      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item" data-section="settings" type="button">⚙ <span>Settings</span></button>
        <div class="term-card">
          <span>Current term</span>
          <strong>2026–27</strong>
          <small>Secretary • Anim</small>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="menuButton" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
        <div class="search">
          <span aria-hidden="true">⌕</span>
          <input id="globalSearch" type="search" placeholder="Search your KITC records..." autocomplete="off" />
        </div>
        <div class="top-actions">
          <button class="icon-button" id="displayButton" type="button" aria-label="Toggle ambient display" aria-pressed="false">◔</button>
          <button class="profile" id="profileButton" type="button" aria-label="Open Secretary profile" aria-expanded="false">A<span>Anim<br /><small>Secretary</small></span></button>
        </div>
      </header>

      <section class="content" id="content">
        <div class="kitc-loading" data-kitc-loading>
          <div class="kitc-loading-orb"></div>
          <div><strong>Loading KITC Secretary Desk</strong><span>Preparing your private workspace…</span></div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="src/kitc-bootstrap.js?v=20260822-12"></script>
  <script src="src/main.js?v=20260822-12"></script>
  <script src="src/secretary-suite.js?v=20260822-12" data-kitc-secretary-suite="true"></script>
  <script src="src/usb-gate.js?v=20260822-12"></script>
  <script src="src/documents.js?v=20260822-12"></script>
  <script src="src/members.js?v=20260822-12"></script>
  <script src="src/supabase-client.js?v=20260822-12"></script>
  <script src="src/polish.js?v=20260822-12"></script>
  <script src="src/dashboard-polish.js?v=20260822-12"></script>
  <script src="src/runtime.js?v=20260822-12"></script>
</body>
</html>
