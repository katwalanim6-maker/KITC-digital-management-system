<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb"><title>KITC Admin Workspace</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="src/styles.css"><link rel="stylesheet" href="src/kitc-theme.css">
  <style>
    #kitcAdminPanel{position:fixed;inset:0;z-index:9999;background:#f5f7fb;padding:12px;overflow:auto}
    #kitcAdminPanel .kitc-admin-close{position:fixed;right:22px;top:18px;z-index:10001;border:1px solid #d0d5dd;border-radius:8px;padding:9px 13px;background:#fff;color:#344054;font-weight:800;cursor:pointer;box-shadow:0 5px 20px rgba(16,24,40,.08)}
    #kitcAdminPanel:not([hidden]) universal-admin-panel{display:block;min-height:calc(100vh - 24px)}
    .kitc-admin-entry{margin-top:8px;width:100%;text-align:left;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;border-radius:8px;padding:10px 11px;font:inherit;cursor:pointer}.kitc-admin-entry:hover{background:rgba(255,255,255,.12)}
    .app-shell .sidebar .brand .brand-logo{display:block!important;width:42px!important;height:42px!important;object-fit:contain!important}.app-shell .topbar .mobile-logo{display:block!important;width:34px!important;height:34px!important;object-fit:contain!important}
  </style>
</head>
<body>
  <div class="app-shell" id="kitcApp">
    <aside class="sidebar" id="sidebar"><div class="brand"><img class="brand-logo" src="favicon.svg" alt="KITC"><div><strong>KITC</strong><span>Admin Workspace</span></div></div>
      <nav class="nav"><button class="nav-item active" data-section="dashboard">Overview</button><button class="nav-item" data-section="members">Members</button><button class="nav-item" data-section="meetings">Meetings</button><button class="nav-item" data-section="tasks">My Tasks</button><button class="nav-item" data-section="events">Events</button><button class="nav-item" data-section="attendance">Attendance</button><button class="nav-item" data-section="documents">Documents</button><button class="nav-item" data-section="reports">Reports</button><button class="kitc-admin-entry" type="button" data-open-kitc-admin>Admin Panel</button></nav>
    </aside>
    <main class="main"><header class="topbar"><button class="mobile-menu" id="menuButton">Menu</button><img class="mobile-logo" src="favicon.svg" alt="KITC"><div class="search"><input id="globalSearch" placeholder="Search KITC records..."></div><div class="top-actions"><button class="profile" id="profileButton">A<span>Admin<br><small>Supabase</small></span></button></div></header><section class="content" id="content"></section></main>
  </div>
  <div class="toast" id="toast"></div><div id="kitcAdminPanel" hidden><button class="kitc-admin-close" type="button" data-close-kitc-admin>Close Admin Panel</button></div>
  <script src="src/kitc-bootstrap.js"></script><script src="src/main.js"></script><script src="src/secretary-suite.js"></script><script src="src/polish.js"></script><script src="src/dashboard-polish.js"></script><script src="src/runtime.js"></script>
  <script src="https://katwalanim6-maker.github.io/Admin/universal-admin-panel.js"></script><script src="src/kitc-admin-panel.js"></script>
</body>
</html>
