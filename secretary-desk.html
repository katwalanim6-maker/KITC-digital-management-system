<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KITC Secretary Desk</title>
  <link rel="icon" href="Screenshot_20260821-202536.png"><link rel="stylesheet" href="src/styles.css"><link rel="stylesheet" href="src/usb-gate.css"><link rel="stylesheet" href="src/kitc-theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    #kitcAdminPanel{position:fixed;inset:0;z-index:9999;background:#f5f7fb;padding:12px;overflow:auto}
    #kitcAdminPanel .kitc-admin-close{position:fixed;right:22px;top:18px;z-index:10001;border:0;border-radius:10px;padding:9px 13px;background:#fff;box-shadow:0 5px 20px rgba(0,0,0,.12);font-weight:800;cursor:pointer}
    #kitcAdminPanel:not([hidden]) universal-admin-panel{display:block;min-height:calc(100vh - 24px)}
    .kitc-admin-entry{margin-top:8px;width:100%;text-align:left;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;border-radius:10px;padding:10px 11px;font:inherit;cursor:pointer}
    .kitc-admin-entry:hover{background:rgba(255,255,255,.12)}
    .kitc-role-selector{margin-top:28px;display:grid;gap:12px}
    .kitc-role-selector[hidden],#kitcAdminLogin[hidden],#kitcRoleBack[hidden],#kitcRoleNotice[hidden]{display:none}
    .kitc-role-title{font-size:13px;font-weight:800;color:#d7d9e2;margin:0 0 2px}
    .kitc-role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .kitc-role-btn{min-height:92px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.045);color:#fff;padding:13px 8px;display:grid;place-items:center;gap:6px;font:inherit;font-weight:800;cursor:pointer;transition:.18s ease}
    .kitc-role-btn span{font-size:24px}.kitc-role-btn small{font-size:11px;color:#a8aab5;font-weight:600}
    .kitc-role-btn:hover,.kitc-role-btn.selected{border-color:rgba(130,120,255,.8);background:rgba(100,90,210,.15);transform:translateY(-1px)}
    .kitc-role-back{margin-top:14px;border:0;background:transparent;color:#9da2b3;padding:4px 0;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
    .kitc-role-back:hover{color:#fff}
    .kitc-role-notice{margin-top:14px;padding:11px 12px;border-radius:10px;background:rgba(255,193,7,.07);border:1px solid rgba(255,193,7,.18);color:#c7c9d2;font-size:11px;line-height:1.5}
    #kitcAdminLogin{margin-top:28px}
    @media(max-width:520px){.kitc-role-grid{grid-template-columns:1fr}.kitc-role-btn{min-height:70px;grid-template-columns:35px 1fr;text-align:left;place-items:center start}.kitc-role-btn span{grid-row:span 2}}
  </style>
</head>
<body>
  <section class="kitc-gate" id="kitcGate">
    <div class="kitc-gate-card">
      <img class="kitc-gate-logo" src="Screenshot_20260821-202536.png" alt="KITC logo">
      <div class="eyebrow">KITC • ACCESS</div>
      <h1 id="kitcGateTitle">Unlock KITC</h1>
      <p id="kitcGateDescription">Choose how you want to access KITC.</p>

      <div class="kitc-role-selector" id="kitcRoleSelector">
        <div class="kitc-role-title">What type of user are you?</div>
        <div class="kitc-role-grid">
          <button class="kitc-role-btn" type="button" data-login-role="member"><span>👤</span><div>Member</div><small>Personal access</small></button>
          <button class="kitc-role-btn" type="button" data-login-role="executive"><span>⭐</span><div>Executive</div><small>Executive workspace</small></button>
          <button class="kitc-role-btn" type="button" data-login-role="admin"><span>🔐</span><div>Admin</div><small>Secretary control panel</small></button>
        </div>
      </div>

      <button class="kitc-role-back" id="kitcRoleBack" type="button" hidden>← Choose a different user type</button>
      <div class="kitc-role-notice" id="kitcRoleNotice" hidden></div>

      <div id="kitcAdminLogin" hidden>
        <label for="kitcPassword">Admin password</label><input id="kitcPassword" type="password" placeholder="Enter admin password">
        <div class="kitc-gate-actions"><button class="kitc-usb" id="connectKitcUsb">🔌 Connect KITC USB</button><button class="kitc-unlock" id="unlockKitc">🔐 Unlock Admin</button></div>
        <div class="kitc-gate-status" id="kitcGateStatus"></div><div id="kitcSetupHint"></div>
      </div>
    </div>
  </section>
  <div class="app-shell" id="kitcApp" hidden>
    <aside class="sidebar" id="sidebar"><div class="brand"><img class="brand-logo" src="Screenshot_20260821-202536.png" alt="KITC"><div><strong>KITC</strong><span>Secretary Desk</span></div></div>
      <nav class="nav"><button class="nav-item active" data-section="dashboard">⌂ <span>Overview</span></button><button class="nav-item" data-section="members">♙ <span>Members</span></button><button class="nav-item" data-section="meetings">▣ <span>Meetings</span></button><button class="nav-item" data-section="tasks">✓ <span>My Tasks</span></button><button class="nav-item" data-section="events">★ <span>Events</span></button><button class="nav-item" data-section="attendance">◷ <span>Attendance</span></button><button class="nav-item" data-section="documents">▱ <span>Documents</span></button><button class="nav-item" data-section="reports">▥ <span>Reports</span></button><button class="kitc-admin-entry" type="button" data-open-kitc-admin>🔐 Admin Panel</button></nav>
    </aside>
    <main class="main"><header class="topbar"><button class="mobile-menu" id="menuButton">☰</button><img class="mobile-logo" src="Screenshot_20260821-202536.png" alt="KITC"><div class="search"><span>⌕</span><input id="globalSearch" placeholder="Search your KITC records..."></div><div class="top-actions"><button class="profile" id="profileButton">A<span>Secretary<br><small>USB Admin</small></span></button></div></header><section class="content" id="content"></section></main>
  </div>
  <div class="toast" id="toast"></div>
  <div id="kitcAdminPanel" hidden><button class="kitc-admin-close" type="button" data-close-kitc-admin>✕ Close Admin</button></div>
  <script src="src/kitc-bootstrap.js"></script><script src="src/main.js"></script><script src="src/secretary-suite.js"></script><script src="src/login-selector.js"></script><script src="src/usb-gate.js"></script><script src="src/documents.js"></script><script src="src/members.js"></script><script src="src/member-profile.js"></script><script src="src/supabase-client.js"></script><script src="src/polish.js"></script><script src="src/dashboard-polish.js"></script><script src="src/runtime.js"></script>
  <script src="https://katwalanim6-maker.github.io/Admin/universal-admin-panel.js"></script>
  <script src="src/kitc-admin-panel.js"></script>
</body>
</html>
