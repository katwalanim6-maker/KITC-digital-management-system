<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><link rel="icon" href="favicon.svg"><title>KITC | Member</title>
<style>body{margin:0;background:#0b0d12;color:#f2f4f7;font-family:Inter,system-ui,sans-serif}.wrap{width:min(760px,calc(100% - 32px));margin:auto}.top{height:72px;border-bottom:1px solid #29313c;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none;font-weight:800}.brand img{width:36px}.brand small{display:block;color:#9aa4b2;font-size:10px;text-transform:uppercase}.link{color:#9aa4b2;font-size:12px}.main{padding:48px 0}.panel{background:#11151c;border:1px solid #29313c;border-radius:8px;padding:28px}.panel h1{margin:0 0 8px}.lead,.muted{color:#9aa4b2;line-height:1.6}.form{display:grid;gap:12px;margin-top:24px}label{font-size:11px;font-weight:800}input{height:44px;border:1px solid #29313c;background:#0d1117;color:#fff;border-radius:6px;padding:0 12px}button{height:44px;border:1px solid #d7dde5;background:#d7dde5;color:#10141a;border-radius:6px;font-weight:800;cursor:pointer}.message{margin-top:14px;padding:12px;background:#151a22;border:1px solid #29313c;border-radius:6px;color:#9aa4b2;font-size:12px}.dashboard{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.card{background:#151a22;border:1px solid #29313c;border-radius:7px;padding:18px}.card h2{font-size:14px;margin:0 0 12px}.value{font-size:19px;font-weight:800}.list{display:grid;gap:8px}.item{padding:11px;border:1px solid #29313c;border-radius:6px}.item strong{font-size:12px}.item span{display:block;color:#9aa4b2;font-size:11px;margin-top:4px}@media(max-width:600px){.grid{grid-template-columns:1fr}.main{padding:30px 0}.panel{padding:22px}}</style>
</head>
<body><header class="wrap top"><a class="brand" href="index.html"><img src="favicon.svg" alt="KITC"><span>KITC<small>Member Workspace</small></span></a><a class="link" href="access.html">Change workspace</a></header>
<main class="wrap main"><section class="panel" id="login"><h1>Member sign in</h1><p class="lead">Enter your KITC account email. We will send a secure sign-in link.</p><form class="form" id="form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><button>Send sign-in link</button></form><div class="message" id="message">Supabase authentication is being prepared.</div></section>
<section class="panel dashboard" id="dashboard"><h1 id="name">Member</h1><p class="lead" id="meta"></p><div class="grid"><div class="card"><h2>Role</h2><div class="value" id="role">Member</div></div><div class="card"><h2>Class</h2><div class="value" id="class"></div></div></div><div class="card" style="margin-top:12px"><h2>Recent attendance</h2><div class="list" id="attendance"></div></div><button id="logout" style="margin-top:18px">Sign out</button></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="src/supabase-client.js"></script><script>
(async()=>{const msg=document.getElementById('message'),login=document.getElementById('login'),dash=document.getElementById('dashboard');const client=window.kitcSupabase;if(!client){msg.textContent='Supabase client is not configured yet.';return}async function load(user){const p=await client.from('profiles').select('full_name,role,account_status').eq('id',user.id).maybeSingle();if(p.error)throw p.error;if(!p.data||p.data.account_status!=='active'||p.data.role!=='member')throw new Error('This account is not configured as an active KITC member.');const m=await client.from('members').select('id,full_name,class_name,section,position_title').eq('user_id',user.id).maybeSingle();if(m.error)throw m.error;document.getElementById('name').textContent=m.data?.full_name||p.data.full_name;document.getElementById('meta').textContent=p.data.full_name+' · KITC member workspace';document.getElementById('role').textContent=m.data?.position_title||'Member';document.getElementById('class').textContent=[m.data?.class_name,m.data?.section].filter(Boolean).join(' / ')||'Not set';const a=await client.from('attendance').select('attendance_date,status,note').eq('member_id',m.data?.id||'').order('attendance_date',{ascending:false}).limit(10);if(a.error)throw a.error;const list=document.getElementById('attendance');list.replaceChildren();if(!a.data?.length){list.innerHTML='<span class="muted">No attendance records found.</span>'}else a.data.forEach(r=>{const x=document.createElement('div');x.className='item';x.innerHTML='<strong>'+r.status+'</strong><span>'+r.attendance_date+(r.note?' · '+r.note:'')+'</span>';list.appendChild(x)})}const s=await client.auth.getSession();if(s.data.session){try{await load(s.data.session.user);login.style.display='none';dash.style.display='block'}catch(e){msg.textContent=e.message}}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Sending sign-in link...';const {error}=await client.auth.signInWithOtp({email:document.getElementById('email').value.trim(),options:{emailRedirectTo:location.href}});msg.textContent=error?error.message:'Check your email for the secure sign-in link.'});document.getElementById('logout').addEventListener('click',async()=>{await client.auth.signOut();location.reload()})})();
</script></body></html>
