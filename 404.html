<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e8dfca">
  <meta name="description" content="The requested KITC page could not be found.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>KITC — Page Not Found</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#e8dfca;color:#28251f;font-family:Georgia,"Times New Roman",serif;display:grid;place-items:center;padding:24px;overflow-x:hidden}.card{width:min(680px,100%);border:1px solid rgba(57,53,45,.6);background:#f1ead8;padding:clamp(28px,7vw,64px);text-align:center;box-shadow:0 18px 45px rgba(47,40,29,.12)}.code{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;color:#6e675a}.mark{width:64px;height:64px;margin:22px auto;border:1px solid #39352d;display:grid;place-items:center;font-weight:700;font-size:24px}.card h1{font-size:clamp(42px,8vw,72px);line-height:.95;font-weight:500;letter-spacing:-.05em;margin:0 0 18px}.card p{color:#6e675a;line-height:1.7;margin:0 auto;max-width:480px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:1px solid #28251f;color:#28251f;text-decoration:none;font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em}.primary{background:#28251f;color:#f1ead8}@media(max-width:520px){.card{padding:30px 20px}.btn{width:100%}}
  </style>
</head>
<body>
  <main class="card">
    <div class="code">KITC / 404</div>
    <div class="mark" aria-hidden="true">K</div>
    <h1>Page not found.</h1>
    <p>The page you requested does not exist or may have moved. Return to the KITC archive and continue from there.</p>
    <div class="actions"><a class="btn primary" href="index.html">Back to KITC</a><a class="btn" href="access.html">Open workspace</a></div>
  </main>
</body>
</html>
