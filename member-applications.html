<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><link rel="icon" href="favicon.svg"><title>KITC | Member Applications</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f2f4f7;font-family:Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:auto}.top{height:72px;border-bottom:1px solid #29313c;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none;font-weight:800}.brand img{width:36px}.brand small{display:block;color:#9aa4b2;font-size:10px;text-transform:uppercase}.link{color:#9aa4b2;font-size:12px}.main{padding:40px 0}.panel{background:#11151c;border:1px solid #29313c;border-radius:8px;padding:24px}.panel h1{margin:0 0 8px}.lead,.muted{color:#9aa4b2;line-height:1.6}.auth{display:grid;gap:10px;max-width:430px;margin-top:22px}label{font-size:11px;font-weight:800}input,textarea,button{font:inherit}input,textarea{border:1px solid #29313c;background:#0d1117;color:#fff;border-radius:6px;padding:11px}button{border:1px solid #d7dde5;background:#d7dde5;color:#10141a;border-radius:6px;padding:11px 14px;font-weight:800;cursor:pointer}.secondary{background:#151a22;color:#d7dde5;border-color:#29313c}.message{margin-top:14px;padding:12px;background:#151a22;border:1px solid #29313c;border-radius:6px;color:#9aa4b2;font-size:12px}.list{display:grid;gap:10px;margin-top:22px}.item{background:#151a22;border:1px solid #29313c;border-radius:7px;padding:16px}.item h2{font-size:15px;margin:0 0 7px}.meta{font-size:11px;color:#9aa4b2;line-height:1.6}.actions{display:flex;gap:8px;margin-top:14px}.actions button{font-size:11px}.reject{background:transparent;color:#d7dde5;border-color:#29313c}.empty{padding:18px;border:1px dashed #29313c;color:#9aa4b2;font-size:12px;margin-top:20px}@media(max-width:600px){.wrap{width:min(100% - 20px,900px)}.main{padding:24px 0}.panel{padding:18px}.actions{flex-direction:column}.actions button{width:100%}}</style></head><body><header class="wrap top"><a class="brand" href="index.html"><img src="favicon.svg" alt="KITC"><span>KITC<small>Member Applications</small></span></a><a class="link" href="secretary-desk.html">Secretary Desk</a></header><main class="wrap main"><section class="panel"><h1>Member Applications</h1><p class="lead">Review self-registration requests. Approval creates the member record and activates member access.</p><div id="app"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="src/supabase-client.js"></script><script>(async()=>{const app=document.getElementById('app'),c=window.kitcSupabase;if(!c){app.innerHTML='<div class="message">Supabase is not configured. Add the KITC publishable key in src/supabase-client.js.</div>';return}const user=(await c.auth.getUser()).data.user;if(!user){app.innerHTML='<div class="auth"><p class="message">Sign in with an existing KITC staff account.</p><label for="email">Staff email</label><input id="email" type="email" autocomplete="username" placeholder="staff email"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"><button id="send">Sign in</button><div class="message" id="msg">Only an active KITC staff role can review applications.</div></div>';document.getElementById('send').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return;const b=document.getElementById('send'),m=document.getElementById('msg');b.disabled=true;m.textContent='Signing in...';const r=await c.auth.signInWithPassword({email,password});if(r.error){m.textContent=r.error.message;b.disabled=false;return}location.reload()};return}const p=await c.from('profiles').select('full_name,role,account_status').eq('id',user.id).maybeSingle();if(p.error||!p.data||p.data.account_status!=='active'||!['admin','secretary','president','vice_president','management','advisor'].includes(p.data.role)){app.innerHTML='<div class="message">This account is not authorized to review member applications.</div>';return}async function load(){app.innerHTML='<div class="message">Loading applications...</div>';const r=await c.from('member_applications').select('id,full_name,email,class_name,section,phone,status,created_at').eq('status','pending').order('created_at',{ascending:true});if(r.error){app.innerHTML='<div class="message">'+esc(r.error.message)+'</div>';return}if(!r.data?.length){app.innerHTML='<div class="empty">No pending member applications.</div>';return}const list=document.createElement('div');list.className='list';r.data.forEach(x=>{const el=document.createElement('article');el.className='item';el.innerHTML='<h2></h2><div class="meta"></div><div class="actions"><button class="approve">Approve</button><button class="reject">Reject</button></div>';el.querySelector('h2').textContent=x.full_name;el.querySelector('.meta').textContent=[x.email,x.class_name&&('Class '+x.class_name),x.section&&('Section '+x.section),x.phone&&('Phone '+x.phone)].filter(Boolean).join(' · ');el.querySelector('.approve').onclick=async()=>{el.querySelectorAll('button').forEach(b=>b.disabled=true);const z=await c.rpc('approve_member_application',{p_application_id:x.id,p_position_title:'Member'});if(z.error){alert(z.error.message);el.querySelectorAll('button').forEach(b=>b.disabled=false);return}await load()};el.querySelector('.reject').onclick=async()=>{const reason=prompt('Optional reason for rejection:')??'';el.querySelectorAll('button').forEach(b=>b.disabled=true);const z=await c.rpc('reject_member_application',{p_application_id:x.id,p_reason:reason});if(z.error){alert(z.error.message);el.querySelectorAll('button').forEach(b=>b.disabled=false);return}await load()};list.appendChild(el)});app.replaceChildren(list)}const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));load()})()</script></body></html>
