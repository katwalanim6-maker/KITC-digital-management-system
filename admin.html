<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="KITC administration workspace for managing club accounts and operational records.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>KITC — Admin Panel</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828;background:#f5f7fb}
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;overflow-x:hidden}
    #kitcAdminPanel{min-height:100vh;padding:12px;max-width:100%;overflow-x:hidden}
    #kitcAdminPanel .kitc-admin-close{position:fixed;right:22px;top:18px;z-index:10001;border:1px solid #d0d5dd;border-radius:8px;padding:9px 13px;background:#fff;color:#344054;font-weight:800;cursor:pointer;box-shadow:0 5px 20px rgba(16,24,40,.08)}
    #kitcAdminPanel universal-admin-panel{display:block;min-height:calc(100vh - 24px);max-width:100%;overflow-x:hidden}
    @media(max-width:600px){#kitcAdminPanel{padding:8px}#kitcAdminPanel .kitc-admin-close{right:10px;top:10px}}
  </style>
</head>
<body>
  <main id="kitcAdminPanel"></main>
  <script src="https://katwalanim6-maker.github.io/Admin/universal-admin-panel.js"></script>
  <script src="src/kitc-admin-panel.js?v=4"></script>
  <script>window.addEventListener('DOMContentLoaded',()=>window.openKitcAdmin?.());</script>
</body>
</html>
