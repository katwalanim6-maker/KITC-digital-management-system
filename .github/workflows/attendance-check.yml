name: Attendance Admin Check
on:
  push:
    branches: [attendance-admin-panel]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check src/attendance-admin.js
          node --check src/attendance-invite.js
          node --check src/attendance-enhancements.js
      - name: Check whitespace errors
        run: git diff --check main...HEAD
