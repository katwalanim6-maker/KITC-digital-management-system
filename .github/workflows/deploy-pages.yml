name: Deploy KITC Secretary Desk to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate KITC entry points
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f access.html
          test -f secretary-desk.html
          test -f src/kitc-bootstrap.js
          test -f src/main.js
          test -f src/secretary-suite.js
          test -f src/login-selector.js
          test -f src/usb-gate.js
          test -f src/documents.js
          test -f src/members.js
          test -f src/member-profile.js
          test -f src/polish.js
          test -f src/dashboard-polish.js
          test -f src/runtime.js
          test -f src/kitc-admin-panel.js
          node --check src/kitc-bootstrap.js
          node --check src/main.js
          node --check src/secretary-suite.js
          node --check src/login-selector.js
          node --check src/usb-gate.js
          node --check src/documents.js
          node --check src/members.js
          node --check src/member-profile.js
          node --check src/polish.js
          node --check src/dashboard-polish.js
          node --check src/runtime.js
          node --check src/kitc-admin-panel.js
          grep -q 'access.html' index.html
          grep -q 'secretary-desk.html' access.html
          ! grep -q 'src/login-selector.js' secretary-desk.html
          grep -q 'src/kitc-admin-panel.js' secretary-desk.html
          echo 'KITC landing, access gate, and Secretary Desk validation passed.'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
