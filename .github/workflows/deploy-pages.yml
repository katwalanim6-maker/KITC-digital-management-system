name: Deploy KITC Digital Management System to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static site
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          refs = re.findall(r'(?:src|href)=["\']([^"\']+)["\']', html)
          local_refs = [r.split("?", 1)[0] for r in refs if not r.startswith(("http://", "https://", "#"))]
          missing = [r for r in local_refs if not Path(r).exists()]
          if missing:
              raise SystemExit("Missing local assets: " + ", ".join(missing))

          forbidden = ["src/secretary-editorial.css", "src/module-fix.js"]
          stale = [r for r in forbidden if r in html]
          if stale:
              raise SystemExit("Obsolete asset still referenced: " + ", ".join(stale))

          required = [
              "index.html",
              "src/styles.css",
              "src/usb-gate.css",
              "src/kitc-theme.css",
              "src/kitc-bootstrap.js",
              "src/main.js",
              "src/usb-gate.js",
              "src/documents.js",
              "src/members.js",
              "src/polish.js",
              "src/secretary-suite.js",
              "supabase/schema.sql",
          ]
          missing_required = [r for r in required if not Path(r).exists()]
          if missing_required:
              raise SystemExit("Missing required project file(s): " + ", ".join(missing_required))

          bootstrap = Path("src/kitc-bootstrap.js").read_text(encoding="utf-8")
          if "src/secretary-suite.js?v=" not in bootstrap:
              raise SystemExit("Secretary suite dynamic loader is missing its cache-busted source")

          print("KITC static-site validation passed.")

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
