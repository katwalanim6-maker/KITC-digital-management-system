name: Deploy KITC Attendance Admin to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate attendance app
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f src/attendance-admin.css
          test -f src/attendance-admin.js
          test -f src/attendance-invite.js
          test -f src/attendance-enhancements.js
          test -f src/attendance-report-fix.js
          node --check src/attendance-admin.js
          node --check src/attendance-invite.js
          node --check src/attendance-enhancements.js
          node --check src/attendance-report-fix.js
          grep -q 'src/attendance-admin.js' index.html
          grep -q 'src/attendance-admin.css' index.html
          echo 'Attendance app validation passed.'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
